[project]
name = "master-thesis-sli0124"
version = "0.1.0"
description = "Master thesis project for time series forecasting"
requires-python = ">=3.12"

dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pylint>=3.0.0",
    "openmeteo-requests>=1.0.0",
    "retry-requests>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "xlrd>=2.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.3.0",
    "ruff>=0.1.0",
    "ipykernel>=6.25.0",
    "transformers>=4.35.0",
    "huggingface-hub>=0.19.0",
    "accelerate>=0.25.0",
    "chronos-forecasting>=1.0.0",
    "timesfm>=1.0.0",
    "uni2ts>=0.1.0",
    "hf-xet>=1.2.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W505", # doc-line-too-long
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88
